name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Установка зависимостей
        run: bun install --frozen-lockfile

      - name: Сборка OCR worker (пре-компиляция в public/)
        run: bun run build:worker

      # Pages — статический хостинг: серверных API-роутов быть не должно.
      # Релей /api/model-proxy нужен только при self-hosting, на Pages
      # модели качаются напрямую с HuggingFace (там включён CORS).
      - name: Удаление серверных API-роутов
        run: rm -rf src/app/api

      # Кастомный домен (r.suredoc.net) обслуживает сайт из корня (/),
      # поэтому basePath и assetPrefix должны быть пустыми.
      - name: Статическая сборка
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_STATIC: "1"
        run: bun run build

      # Без этого файла Jekyll игнорирует каталоги с подчёркиванием (_next/),
      # и CSS/JS/шрифты Next.js отдают 404.
      - name: Отключение Jekyll
        run: touch out/.nojekyll

      # Проверка, что сборка действительно создала нужные файлы.
      # Если этот шаг падает — значит NEXT_OUTPUT не сработал,
      # или папка называется иначе (например, dist/).
      - name: Проверка артефакта
        run: |
          test -f out/index.html || (echo "::error::out/index.html не найден — проверьте настройки output в next.config.js" && exit 1)
          test -d out/_next || (echo "::error::out/_next не найден — статический экспорт не сгенерировал ассеты" && exit 1)
          test -f out/.nojekyll || (echo "::error::out/.nojekyll не создан" && exit 1)
          echo "OK: index.html, _next/ и .nojekyll на месте"

      - name: Настройка Pages
        uses: actions/configure-pages@v5

      # include-hidden-files обязателен: по умолчанию upload-pages-artifact
      # отфильтровывает файлы, начинающиеся с точки, и .nojekyll теряется.
      - name: Загрузка артефакта
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Деплой на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
