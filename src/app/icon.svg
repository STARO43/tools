<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="6" y1="4" x2="18" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d4eefa"/>
      <stop offset="0.5" stop-color="#bfe4f5"/>
      <stop offset="1" stop-color="#a8d8ee"/>
    </linearGradient>
    <linearGradient id="cloudShine" x1="8" y1="5" x2="16" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Маска: облако минус полоса по линии (справа налево) -->
    <mask id="cloudCut">
      <rect width="24" height="24" fill="black"/>
      <path fill="white" d="
        M6.5 18
        A4 4 0 0 1 6.5 10
        A4.5 4.5 0 0 1 15 7.5
        A3.5 3.5 0 0 1 19.5 14
        A3.5 3.5 0 0 1 17.5 18
        Z
      "/>
      <!-- дырка справа налево (немного уже) -->
      <line x1="23" y1="1" x2="1" y2="23"
            stroke="black" stroke-width="4.5" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- Облако с вырезанной дыркой -->
  <g mask="url(#cloudCut)">
    <path fill="url(#cloudGrad)" d="
      M6.5 18
      A4 4 0 0 1 6.5 10
      A4.5 4.5 0 0 1 15 7.5
      A3.5 3.5 0 0 1 19.5 14
      A3.5 3.5 0 0 1 17.5 18
      Z
    "/>
    <path fill="url(#cloudShine)" opacity="0.6" d="
      M7 10
      A3.5 3.5 0 0 1 13.5 8
      A3 3 0 0 1 17 12
      A2.5 2.5 0 0 1 15.5 15.5
      L8 15.5
      A3.5 3.5 0 0 1 7 10
      Z
    "/>
  </g>

  <!-- Тонкая красная линия поверх, справа налево -->
  <line x1="23" y1="1" x2="1" y2="23"
        stroke="#e02020" stroke-width="1.6" stroke-linecap="round"/>
</svg>
