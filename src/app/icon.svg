<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Белая бумажная подложка со скруглениями (как в лого) -->
  <rect width="32" height="32" rx="6" fill="#ffffff" />

  <!-- Черные полоски (текст до лазера) -->
  <g fill="#000000">
    <rect x="4" y="5"  width="24" height="1.8" />
    <rect x="4" y="8.5"  width="18" height="1.8" />
    <rect x="4" y="12" width="24" height="1.8" />
    <rect x="4" y="15.5" width="14" height="1.8" />
    <rect x="4" y="19" width="24" height="1.8" />
    <rect x="4" y="22.5" width="16" height="1.8" />
    <rect x="4" y="26" width="20" height="1.8" />
  </g>

  <!-- Красный лазер по центру (зафиксирован, чтобы было видно на 16х16) -->
  <rect x="0" y="14" width="32" height="1.5" fill="#ff0000" />
  
  <!-- Серые полоски (текст после лазера) -->
  <g fill="#a0a0a0">
    <rect x="4" y="15.5" width="14" height="1.8" />
    <rect x="4" y="19" width="24" height="1.8" />
    <rect x="4" y="22.5" width="16" height="1.8" />
    <rect x="4" y="26" width="20" height="1.8" />
  </g>
</svg>
